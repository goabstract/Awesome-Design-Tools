name: add-screensize

on:
  push:
    branches: [add-screensize]
    paths: ['.github/workflows/add-screensize.yml']

permissions:
  contents: write

jobs:
  insert-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-screensize

      - name: Insert ScreenSize entry into README
        run: |
          grep -q 'screensize.net' README.md && { echo "already present"; exit 0; }
          [ "$(grep -c 'canvasflip.com/visual-inspector/' README.md)" = "1" ] || { echo "anchor not unique"; exit 1; }
          sed -i '\|canvasflip.com/visual-inspector/|a - [ScreenSize](https://screensize.net) — instantly view your screen size, viewport, resolution, and device pixel ratio to debug responsive layouts.' README.md
          grep -n 'screensize.net' README.md

      - name: Commit and push
        run: |
          git config user.name screensizenet
          git config user.email screensizenet@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Add ScreenSize"
          fi
          git push origin HEAD:add-screensize
